name: CI & deploy

# Checks run on every pull request; a push to main additionally deploys to
# Cloudflare Workers. Build and deploy are separate steps on purpose —
# `opennextjs-cloudflare deploy` does not rebuild, it publishes the bundle the
# build step produced, so a PR gets the identical build without deploying.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never let two deploys race. PR check runs supersede themselves instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The build prerenders pages, which fetches TWDB, USGS, NWPS, USDM and
    # CoCoRaHS. That is slower and less predictable than a self-contained
    # build, hence the generous ceiling.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # NEXT_PUBLIC_SITE_URL comes from the committed .env.production, so
      # prerendered canonical and og:image URLs point at the real origin.
      - name: Build Workers bundle
        run: npm run cf:build

      # Uploads the assets and cache to KV, then `wrangler deploy`. Requires
      # a Cloudflare API token with Workers Scripts:Edit and Workers KV
      # Storage:Edit. Fails loudly rather than skipping if it is missing —
      # a green run must mean the site actually shipped.
      # Pushes to main deploy; so does a manual run from the Actions tab, which
      # is how you redeploy without a code change. Pull requests never do.
      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
